name: Build

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  BUILD_TYPE: RelWithDebInfo
  # Disable interactive features
  DEBIAN_FRONTEND: noninteractive

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            make \
            libssl-dev \
            libplist-dev \
            gstreamer1.0-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-x \
            libgl1-mesa-dev \
            libdbus-1-dev \
            pkg-config

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -x build/uxplay
          ls -la build/uxplay

      - name: Protocol and memory regressions
        run: ctest --test-dir build --output-on-failure -R 'Pairing|SetupLength|RtpCleanup|MirrorCleanup|RaopNtp|MirrorNal'

  build-windows-intel:
    runs-on: windows-latest
    strategy:
        fail-fast: false
      matrix:
        msystem: [UCRT64, MINGW64]
        include:
          - msystem: UCRT64
            pkg_prefix: mingw-w64-ucrt-x86_64
            path_prefix: ucrt64
          - msystem: MINGW64
            pkg_prefix: mingw-w64-x86_64
            path_prefix: mingw64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-openssl
            ${{ matrix.pkg_prefix }}-libplist
            ${{ matrix.pkg_prefix }}-gstreamer
            ${{ matrix.pkg_prefix }}-gst-plugins-base
            ${{ matrix.pkg_prefix }}-gst-plugins-good
            ${{ matrix.pkg_prefix }}-pkg-config
            base-devel

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /${{ matrix.path_prefix }}/lib/pkgconfig
        run: |
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -f build/uxplay.exe
          ls -la build/uxplay.exe

      - name: Protocol and memory regressions
        run: ctest --test-dir build --output-on-failure -R 'Pairing|SetupLength|RtpCleanup|MirrorCleanup|RaopNtp|MirrorNal'


  build-windows-arm64:
    runs-on: windows-11-arm
    strategy:
      matrix:
        msystem: [CLANGARM64]
        include:
          - msystem: CLANGARM64
            pkg_prefix: mingw-w64-clang-aarch64
            path_prefix: clangarm64
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkg_prefix }}-cmake
            ${{ matrix.pkg_prefix }}-gcc
            ${{ matrix.pkg_prefix }}-openssl
            ${{ matrix.pkg_prefix }}-libplist
            ${{ matrix.pkg_prefix }}-gstreamer
            ${{ matrix.pkg_prefix }}-gst-plugins-base
            ${{ matrix.pkg_prefix }}-gst-plugins-good
            ${{ matrix.pkg_prefix }}-pkg-config
            base-devel

      - name: Configure CMake
        env:
          PKG_CONFIG_PATH: /${{ matrix.path_prefix }}/lib/pkgconfig
        run: |
          cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DNO_X11_DEPS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Verify binary
        run: |
          test -f build/uxplay.exe
          ls -la build/uxplay.exe

      - name: Protocol regressions
        run: ctest --test-dir build --output-on-failure -R 'Pairing|SetupLength|RtpCleanup|MirrorCleanup|RaopNtp|MirrorNal'
